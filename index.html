<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Digital Twin</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0b0f14; font-family: "Segoe UI", system-ui, sans-serif; }
      #app { width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 12px; left: 12px;
        color: #e8eef7; font-size: 13px; line-height: 1.6;
        background: rgba(20, 26, 34, 0.8); border: 1px solid #2a3444;
        border-radius: 8px; padding: 10px 14px; user-select: none;
      }
      #hud b { color: #fca5a5; }
      #speed {
        position: fixed; bottom: 16px; right: 20px;
        color: #e8eef7; font-size: 32px; font-weight: 700;
        background: rgba(20, 26, 34, 0.8); border: 1px solid #2a3444;
        border-radius: 8px; padding: 8px 18px; user-select: none;
      }
      #speed span { font-size: 14px; color: #8b9bb4; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>F1 Digital Twin — Phase 0</b><br />
      W/S throttle-brake · A/D steer<br />
      C camera (chase / onboard / free) · F force arrows
    </div>
    <div id="speed"><span id="speed-val">0</span> <span>km/h</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
