<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Digital Twin</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0b0f14; font-family: "Segoe UI", system-ui, sans-serif; }
      #app { width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 12px; left: 12px;
        color: #e8eef7; font-size: 13px; line-height: 1.6;
        background: rgba(20, 26, 34, 0.8); border: 1px solid #2a3444;
        border-radius: 8px; padding: 10px 14px; user-select: none;
      }
      #hud b { color: #fca5a5; }
      #speed {
        position: fixed; bottom: 16px; right: 20px;
        color: #e8eef7; font-size: 32px; font-weight: 700;
        background: rgba(20, 26, 34, 0.8); border: 1px solid #2a3444;
        border-radius: 8px; padding: 8px 18px; user-select: none;
      }
      #speed span { font-size: 14px; color: #8b9bb4; font-weight: 400; }
      #tires {
        position: fixed; bottom: 16px; left: 20px;
        background: rgba(20, 26, 34, 0.8); border: 1px solid #2a3444;
        border-radius: 8px; padding: 10px 12px; user-select: none;
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        color: #e8eef7; font-size: 11px; text-align: center;
      }
      #tires .tire {
        width: 54px; padding: 5px 4px; border-radius: 6px;
        background: #1c2430; border: 2px solid #444;
      }
      #tires .tire .t { font-size: 14px; font-weight: 700; }
      #tires .tire .w { height: 4px; background: #2a3444; border-radius: 2px; margin-top: 4px; overflow: hidden; }
      #tires .tire .w div { height: 100%; background: #10b981; width: 100%; }
      #tires .compound { grid-column: 1 / 3; color: #8b9bb4; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>F1 Digital Twin — Phase 0</b><br />
      W/S throttle-brake · A/D steer<br />
      C camera (chase / onboard / free) · F force arrows
    </div>
    <div id="speed"><span id="speed-val">0</span> <span>km/h</span></div>
    <div id="tires">
      <div class="tire" id="tire-f"><div class="t">60°</div><div>Front</div><div class="w"><div></div></div></div>
      <div class="tire" id="tire-r"><div class="t">60°</div><div>Rear</div><div class="w"><div></div></div></div>
      <div class="compound" id="compound-label">Medium</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
